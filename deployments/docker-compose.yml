version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: f4f_arena_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-f4f_arena}
      POSTGRES_USER: ${POSTGRES_USER:-f4f_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f4f_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f4f_admin} -d ${POSTGRES_DB:-f4f_arena}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
